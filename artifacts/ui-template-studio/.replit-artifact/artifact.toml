kind = "web"
previewPath = "/"
title = "UI Template Studio"
description = "A responsive web app that showcases reusable UI templates for dashboards, data tables, forms, onboarding, and empty states in one cohesive design system."
version = "1.0.0"
id = "artifacts/ui-template-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20957

[services.development]
run = "pnpm --filter @workspace/ui-template-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ui-template-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ui-template-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20957"
BASE_PATH = "/"
